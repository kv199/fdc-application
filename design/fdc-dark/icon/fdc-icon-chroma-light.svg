<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">FDC Chroma Light icon study</title>
  <desc id="description">An italic F with dark olive, painted olive, and lime gradients on a warm white rounded tile.</desc>
  <defs>
    <linearGradient id="spine" x1="24%" y1="100%" x2="71%" y2="0%">
      <stop offset="0%" stop-color="#152019"/>
      <stop offset="100%" stop-color="#576a5b"/>
    </linearGradient>
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="125" y1="132" x2="405" y2="132">
      <stop offset="0%" stop-color="#576a5b"/>
      <stop offset="35%" stop-color="#576a5b"/>
      <stop offset="100%" stop-color="#c3ed83"/>
    </linearGradient>
    <linearGradient id="middle" gradientUnits="userSpaceOnUse" x1="96" y1="280" x2="342" y2="280">
      <stop offset="0%" stop-color="#152019"/>
      <stop offset="40%" stop-color="#576a5b"/>
      <stop offset="100%" stop-color="#c3ed83"/>
    </linearGradient>
  </defs>
  <!-- The tile and every gradient stop use established FDC tokens. -->
  <rect width="512" height="512" rx="104" fill="#fbfcf4"/>
  <rect x="1" y="1" width="510" height="510" rx="103" fill="none" stroke="#d5dbc9" stroke-width="2"/>
  <path d="M139 93H221L165 422H79Z" fill="url(#spine)"/>
  <path d="M139 93H405L363 171H125Z" fill="url(#top)"/>
  <path d="M113 243H342L301 316H96Z" fill="url(#middle)"/>
</svg>
