<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">FDC Chroma Photon Black icon study</title>
  <desc id="description">The same seamless italic F with one soft lime light-source gradient on a black rounded tile.</desc>
  <defs>
    <radialGradient id="mark" gradientUnits="userSpaceOnUse" cx="348" cy="114" r="390">
      <stop offset="0%" stop-color="#d5f6a6"/>
      <stop offset="24%" stop-color="#c3ed83"/>
      <stop offset="52%" stop-color="#8c9b82"/>
      <stop offset="100%" stop-color="#576a5b"/>
    </radialGradient>
  </defs>
  <!-- The F contour matches the light icon. Its darker stops are raised for contrast. -->
  <rect width="512" height="512" rx="104" fill="#000"/>
  <rect x="1" y="1" width="510" height="510" rx="103" fill="none" stroke="#405346" stroke-width="2"/>
  <path d="M139 93H405L363 171H207.7234L195.4681 243H342L301 316H183.0426L165 422H79Z" fill="url(#mark)"/>
</svg>
