<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">FDC Chroma Black icon study</title>
  <desc id="description">The same seamless italic F with its original olive-to-lime gradient on a softly illuminated black rounded tile.</desc>
  <defs>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="89" y1="420" x2="402" y2="93">
      <stop offset="0%" stop-color="#576a5b"/>
      <stop offset="46%" stop-color="#8c9b82"/>
      <stop offset="100%" stop-color="#c3ed83"/>
    </linearGradient>
    <radialGradient id="tile" gradientUnits="userSpaceOnUse" cx="350" cy="130" r="560">
      <stop offset="0%" stop-color="#1e2a22"/>
      <stop offset="52%" stop-color="#0b110e"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>
  <!-- The F keeps its prior linear fill and smooth left edge. Light falls on the tile. -->
  <rect width="512" height="512" rx="104" fill="url(#tile)"/>
  <rect x="1" y="1" width="510" height="510" rx="103" fill="none" stroke="#405346" stroke-width="2"/>
  <path d="M139 93H405L363 171H207.7234L195.4681 243H342L301 316H183.0426L165 422H79Z" fill="url(#mark)"/>
</svg>
