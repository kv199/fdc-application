<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">FDC Chroma Unified Black icon study</title>
  <desc id="description">The same single italic F and olive-to-lime gradient on a black rounded tile.</desc>
  <defs>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="89" y1="420" x2="402" y2="93">
      <stop offset="0%" stop-color="#576a5b"/>
