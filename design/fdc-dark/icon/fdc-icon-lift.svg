<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">FDC Signal F lift variant</title>
  <desc id="description">A large cream F with two shortened angled arms, wider green and red detached pieces, and a subdued olive gradient tile.</desc>
  <!-- Vector interpretation of the user's sketch. Green and red follow the
       HUD throttle and brake tokens in overlay/tokens.css. -->
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3a2e"/>
      <stop offset="52%" stop-color="#1e2a22"/>
      <stop offset="100%" stop-color="#111b15"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#tile)"/>
  <path d="M78 88H319L268 166H181V250H249L199 327H181V444H78Z" fill="#edf0df"/>
  <path d="M338 72H446L395 150H287Z" fill="#69e83f"/>
  <path d="M273 226H376L326 303H223Z" fill="#ff312b"/>
</svg>
